name: contribution-snake

# Regenerates the on-brand contribution-graph snake once a day.
# Output lives on the `output` branch so main's history stays clean.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#D97757&color_dots=#F0EEE6,#D8DEC9,#B5C29E,#8FA172,#556640
            dist/snake-dark.svg?color_snake=#D97757&color_dots=#24231F,#3B4530,#556640,#788C5D,#A9BC8A
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore(automation): regenerate contribution snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
