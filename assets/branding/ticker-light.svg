<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 84" width="1200" height="84" role="img" aria-labelledby="t d">
<title id="t">Currently investigating</title>
<desc id="d">Typewriter line cycling through: epistemic independence in interacting LLMs; confidence contagion &amp; information cascades; persuasion and behavioral drift in LLMs; evaluation of AI in high-stakes settings; human cognition ↔ artificial-agent behavior.</desc>
<style>
.serif{font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif}
.mono{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.ink{fill:#141413} .muted{fill:#5E5D59} .moss{fill:#556640}
.wine{fill:#B4532F} .clay{fill:#B4532F} .sig{fill:#D97757}
.hair{stroke:#E3E0D6;stroke-width:1;fill:none}
.line{stroke:#5E5D59;stroke-width:0.9;fill:none}
.motif{stroke:#788C5D;stroke-width:1.1;fill:none;stroke-linecap:round}
.box{fill:#F0EEE6;stroke:#E3E0D6;stroke-width:1}
.label{font-size:11px;letter-spacing:1.8px}
@keyframes draw{from{stroke-dashoffset:260}to{stroke-dashoffset:0}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes travel{0%{offset-distance:0%;opacity:0}8%{opacity:1}92%{opacity:1}100%{offset-distance:100%;opacity:0}}
@keyframes glow{0%,62%,100%{r:4.2px;opacity:1}70%{r:6.5px;opacity:.55}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.draw{stroke-dasharray:260;animation:draw 2.4s cubic-bezier(.4,0,.2,1) both}
.late{animation:fadein 1.2s ease-out 1.6s both}
.pulse{opacity:0;offset-path:path('M900,185 L980,185 L1040,140 L1100,172');animation:travel 3.2s ease-in-out 2.6s infinite}
.glow{animation:glow 3.2s ease-in-out 2.6s infinite}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 6s ease-in-out infinite}
.cursor{animation:blink 1.1s steps(1) infinite}
</style>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#5E5D59" stroke-width="1.3"/></marker></defs>
<rect width="1200" height="84" rx="6" fill="#FAF9F5"/>
<style>@keyframes show{0%,19.90%{opacity:1}20.00%,100%{opacity:0}}.ph0{animation:show 17.0s linear -17.0s infinite}@keyframes type0{0%{transform:translateX(0)}9.00%,100%{transform:translateX(408px)}}.cv0{animation:type0 17.0s steps(42,end) -17.0s infinite}.ph1{animation:show 17.0s linear -13.6s infinite}@keyframes type1{0%{transform:translateX(0)}9.00%,100%{transform:translateX(418px)}}.cv1{animation:type1 17.0s steps(43,end) -13.6s infinite}.ph2{animation:show 17.0s linear -10.2s infinite}@keyframes type2{0%{transform:translateX(0)}9.00%,100%{transform:translateX(380px)}}.cv2{animation:type2 17.0s steps(39,end) -10.2s infinite}.ph3{animation:show 17.0s linear -6.8s infinite}@keyframes type3{0%{transform:translateX(0)}9.00%,100%{transform:translateX(390px)}}.cv3{animation:type3 17.0s steps(40,end) -6.8s infinite}.ph4{animation:show 17.0s linear -3.4s infinite}@keyframes type4{0%{transform:translateX(0)}9.00%,100%{transform:translateX(418px)}}.cv4{animation:type4 17.0s steps(43,end) -3.4s infinite}</style>
<text x="48" y="52" class="mono muted" font-size="15" text-anchor="start">&gt; currently investigating:</text>
<g class="ph ph0"><text x="300" y="52" class="mono ink" font-size="15" text-anchor="start">epistemic independence in interacting LLMs</text><g class="cover cv0"><rect x="298" y="30" width="428" height="32" fill="#FAF9F5"/><rect x="300" y="38" width="8" height="18" class="sig cursor"/></g></g>
<g class="ph ph1"><text x="300" y="52" class="mono ink" font-size="15" text-anchor="start">confidence contagion &amp; information cascades</text><g class="cover cv1"><rect x="298" y="30" width="438" height="32" fill="#FAF9F5"/><rect x="300" y="38" width="8" height="18" class="sig cursor"/></g></g>
<g class="ph ph2"><text x="300" y="52" class="mono ink" font-size="15" text-anchor="start">persuasion and behavioral drift in LLMs</text><g class="cover cv2"><rect x="298" y="30" width="400" height="32" fill="#FAF9F5"/><rect x="300" y="38" width="8" height="18" class="sig cursor"/></g></g>
<g class="ph ph3"><text x="300" y="52" class="mono ink" font-size="15" text-anchor="start">evaluation of AI in high-stakes settings</text><g class="cover cv3"><rect x="298" y="30" width="410" height="32" fill="#FAF9F5"/><rect x="300" y="38" width="8" height="18" class="sig cursor"/></g></g>
<g class="ph ph4"><text x="300" y="52" class="mono ink" font-size="15" text-anchor="start">human cognition ↔ artificial-agent behavior</text><g class="cover cv4"><rect x="298" y="30" width="438" height="32" fill="#FAF9F5"/><rect x="300" y="38" width="8" height="18" class="sig cursor"/></g></g>
</svg>
