<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 344" width="1200" height="344" role="img" aria-labelledby="t d">
<title id="t">Project Aletheia program timeline</title>
<desc id="d">Four studies left to right: Persuasion Topography (v0, exploratory), Pressure evals v0.1 (complete, public), Exp 001 (preregistered, no data yet), multi-agent cascades (planned).</desc>
<style>
.serif{font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif}
.mono{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.ink{fill:#141413} .muted{fill:#5E5D59} .moss{fill:#556640}
.wine{fill:#B4532F} .clay{fill:#B4532F} .sig{fill:#D97757}
.hair{stroke:#E3E0D6;stroke-width:1;fill:none}
.line{stroke:#5E5D59;stroke-width:0.9;fill:none}
.motif{stroke:#788C5D;stroke-width:1.1;fill:none;stroke-linecap:round}
.box{fill:#F0EEE6;stroke:#E3E0D6;stroke-width:1}
.label{font-size:11px;letter-spacing:1.8px}
@keyframes draw{from{stroke-dashoffset:260}to{stroke-dashoffset:0}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes travel{0%{offset-distance:0%;opacity:0}8%{opacity:1}92%{opacity:1}100%{offset-distance:100%;opacity:0}}
@keyframes glow{0%,62%,100%{r:4.2px;opacity:1}70%{r:6.5px;opacity:.55}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.draw{stroke-dasharray:260;animation:draw 2.4s cubic-bezier(.4,0,.2,1) both}
.late{animation:fadein 1.2s ease-out 1.6s both}
.pulse{opacity:0;offset-path:path('M900,185 L980,185 L1040,140 L1100,172');animation:travel 3.2s ease-in-out 2.6s infinite}
.glow{animation:glow 3.2s ease-in-out 2.6s infinite}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 6s ease-in-out infinite}
.cursor{animation:blink 1.1s steps(1) infinite}
</style>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#5E5D59" stroke-width="1.3"/></marker></defs>
<rect width="1200" height="344" rx="6" fill="#FAF9F5"/>
<style>@keyframes grow{from{stroke-dashoffset:600}to{stroke-dashoffset:0}}.grow{stroke-dasharray:600;animation:grow 3s cubic-bezier(.4,0,.2,1) .3s both}@keyframes pop{0%{opacity:0;transform:scale(.4)}100%{opacity:1;transform:scale(1)}}.pop0{transform-box:fill-box;transform-origin:center;animation:pop .6s ease-out 0.30s both}.pop1{transform-box:fill-box;transform-origin:center;animation:pop .6s ease-out 1.05s both}.pop2{transform-box:fill-box;transform-origin:center;animation:pop .6s ease-out 1.80s both}.pop3{transform-box:fill-box;transform-origin:center;animation:pop .6s ease-out 2.55s both}</style>
<text x="48" y="56" class="mono wine label" text-anchor="start">PROGRAM</text>
<text x="48" y="86" class="serif ink" font-size="20" text-anchor="start" font-style="italic">From a taxonomy of pressure to agents influencing agents.</text>
<line x1="150" y1="170" x2="1050" y2="170" class="line"/>
<line x1="150" y1="170" x2="750" y2="170" stroke="#D97757" stroke-width="2" class="grow"/>
<circle cx="150" cy="170" r="9" class="sig pop0"/>
<text x="150" y="142" class="serif ink" font-size="18" text-anchor="middle">Persuasion Topography</text>
<text x="150" y="208" class="mono muted" font-size="12" text-anchor="middle">taxonomy of pressures</text>
<text x="150" y="230" class="mono muted" font-size="11.5" text-anchor="middle" letter-spacing="0.6">v0 · exploratory</text>
<circle cx="450" cy="170" r="9" class="sig pop1"/>
<text x="450" y="142" class="serif ink" font-size="18" text-anchor="middle">Pressure evals v0.1</text>
<text x="450" y="208" class="mono muted" font-size="12" text-anchor="middle">180 outputs · 2 judges</text>
<text x="450" y="230" class="mono clay" font-size="11.5" text-anchor="middle" letter-spacing="0.6">complete · public</text>
<circle cx="750" cy="170" r="9" class="sig pop2"/>
<text x="750" y="142" class="serif ink" font-size="18" text-anchor="middle">Exp 001</text>
<text x="750" y="208" class="mono muted" font-size="12" text-anchor="middle">source attribution</text>
<text x="750" y="230" class="mono moss" font-size="11.5" text-anchor="middle" letter-spacing="0.6">preregistered · no data yet</text>
<circle cx="1050" cy="170" r="8" class="motif pop3" style="fill:#FAF9F5" stroke-dasharray="3 3"/>
<text x="1050" y="142" class="serif ink" font-size="18" text-anchor="middle">Multi-agent cascades</text>
<text x="1050" y="208" class="mono muted" font-size="12" text-anchor="middle">confidence contagion</text>
<text x="1050" y="230" class="mono muted" font-size="11.5" text-anchor="middle" letter-spacing="0.6">planned</text>
<line x1="48" y1="270" x2="1152" y2="270" class="hair"/>
<text x="48" y="296" class="mono wine label" text-anchor="start">TIMELINE</text>
<text x="140" y="296" class="serif muted" font-size="14" text-anchor="start">Filled: exists. Dashed: planned. Status labels are literal; no study is</text>
<text x="140" y="316" class="serif muted" font-size="14" text-anchor="start">described as having results it does not have.</text>
</svg>
