<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" width="1200" height="590" role="img" aria-labelledby="t d">
<title id="t">Figure 1: Research program map</title>
<desc id="d">Three columns. Biological and human systems: cognitive control, social cognition, neuroethics. Shared questions: when should an agent update on another's claim; can confidence spread independently of evidence; what does social pressure do to model behavior; do our evaluations measure what we think. Artificial systems: interacting LLMs, model behavior, evaluation. Below, an axis from biological to artificial places CogNeW EEG work, a neurorights poster, Aletheia Exp 001, Persuasion Topography, pressure evals v0.1, and ABIM clinical AI evaluation.</desc>
<style>
.serif{font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif}
.mono{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.ink{fill:#FAF9F5} .muted{fill:#B0AEA5} .moss{fill:#A9BC8A}
.wine{fill:#E08A6D} .clay{fill:#E08A6D} .sig{fill:#D97757}
.hair{stroke:#3A3934;stroke-width:1;fill:none}
.line{stroke:#B0AEA5;stroke-width:0.9;fill:none}
.motif{stroke:#95A876;stroke-width:1.1;fill:none;stroke-linecap:round}
.box{fill:#24231F;stroke:#3A3934;stroke-width:1}
.label{font-size:11px;letter-spacing:1.8px}
@keyframes draw{from{stroke-dashoffset:260}to{stroke-dashoffset:0}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes travel{0%{offset-distance:0%;opacity:0}8%{opacity:1}92%{opacity:1}100%{offset-distance:100%;opacity:0}}
@keyframes glow{0%,62%,100%{r:4.2px;opacity:1}70%{r:6.5px;opacity:.55}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.draw{stroke-dasharray:260;animation:draw 2.4s cubic-bezier(.4,0,.2,1) both}
.late{animation:fadein 1.2s ease-out 1.6s both}
.pulse{opacity:0;offset-path:path('M900,185 L980,185 L1040,140 L1100,172');animation:travel 3.2s ease-in-out 2.6s infinite}
.glow{animation:glow 3.2s ease-in-out 2.6s infinite}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 6s ease-in-out infinite}
.cursor{animation:blink 1.1s steps(1) infinite}
</style>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#B0AEA5" stroke-width="1.3"/></marker></defs>
<rect width="1200" height="590" rx="6" fill="#1A1915"/>
<text x="48" y="56" class="mono moss label" text-anchor="start">BIOLOGICAL &amp; HUMAN SYSTEMS</text>
<text x="600" y="56" class="mono wine label" text-anchor="middle">SHARED QUESTIONS</text>
<text x="1152" y="56" class="mono clay label" text-anchor="end">ARTIFICIAL SYSTEMS</text>
<rect x="48" y="84" width="280" height="72" rx="4" class="box"/>
<text x="64" y="114" class="serif ink" font-size="17" text-anchor="start">Cognitive control</text>
<text x="64" y="138" class="mono muted" font-size="12" text-anchor="start">EEG · neuromodulation · ML</text>
<path d="M328,120 H364" class="line"/>
<rect x="48" y="176" width="280" height="72" rx="4" class="box"/>
<text x="64" y="206" class="serif ink" font-size="17" text-anchor="start">Social cognition</text>
<text x="64" y="230" class="mono muted" font-size="12" text-anchor="start">theory of mind · persuasion · trust</text>
<path d="M328,212 H364" class="line"/>
<rect x="48" y="268" width="280" height="72" rx="4" class="box"/>
<text x="64" y="298" class="serif ink" font-size="17" text-anchor="start">Neuroethics</text>
<text x="64" y="322" class="mono muted" font-size="12" text-anchor="start">neurorights · cognitive sovereignty</text>
<path d="M328,304 H364" class="line"/>
<rect x="872" y="84" width="280" height="72" rx="4" class="box"/>
<text x="888" y="114" class="serif ink" font-size="17" text-anchor="start">Interacting LLMs</text>
<text x="888" y="138" class="mono muted" font-size="12" text-anchor="start">source attribution · cascades</text>
<path d="M872,120 H836" class="line"/>
<rect x="872" y="176" width="280" height="72" rx="4" class="box"/>
<text x="888" y="206" class="serif ink" font-size="17" text-anchor="start">Model behavior</text>
<text x="888" y="230" class="mono muted" font-size="12" text-anchor="start">persuasion · pressure · drift</text>
<path d="M872,212 H836" class="line"/>
<rect x="872" y="268" width="280" height="72" rx="4" class="box"/>
<text x="888" y="298" class="serif ink" font-size="17" text-anchor="start">Evaluation</text>
<text x="888" y="322" class="mono muted" font-size="12" text-anchor="start">LLM-as-judge · clinical AI</text>
<path d="M872,304 H836" class="line"/>
<path d="M364,120 V304" class="line"/>
<path d="M836,120 V304" class="line"/>
<rect x="400" y="96" width="400" height="44" rx="22" class="box"/>
<text x="600" y="124" class="serif ink" font-size="15.5" text-anchor="middle" font-style="italic">When should an agent update on another's claim?</text>
<path d="M364,118 H400" class="line" marker-end="url(#arr)"/>
<path d="M836,118 H800" class="line" marker-end="url(#arr)"/>
<rect x="400" y="160" width="400" height="44" rx="22" class="box"/>
<text x="600" y="188" class="serif ink" font-size="15.5" text-anchor="middle" font-style="italic">Can confidence spread independently of evidence?</text>
<path d="M364,182 H400" class="line" marker-end="url(#arr)"/>
<path d="M836,182 H800" class="line" marker-end="url(#arr)"/>
<rect x="400" y="224" width="400" height="44" rx="22" class="box"/>
<text x="600" y="252" class="serif ink" font-size="15.5" text-anchor="middle" font-style="italic">What does social pressure do to model behavior?</text>
<path d="M364,246 H400" class="line" marker-end="url(#arr)"/>
<path d="M836,246 H800" class="line" marker-end="url(#arr)"/>
<rect x="400" y="288" width="400" height="44" rx="22" class="box"/>
<text x="600" y="316" class="serif ink" font-size="15.5" text-anchor="middle" font-style="italic">Do our evaluations measure what we think they do?</text>
<path d="M364,310 H400" class="line" marker-end="url(#arr)"/>
<path d="M836,310 H800" class="line" marker-end="url(#arr)"/>
<text x="48" y="384" class="mono muted label" text-anchor="start">WHERE EACH PROJECT SITS</text>
<line x1="48" y1="430" x2="1152" y2="430" stroke="#FAF9F5" stroke-width="0.8"/>
<text x="48" y="474" class="mono moss" font-size="11" text-anchor="start">biological</text>
<text x="1152" y="474" class="mono clay" font-size="11" text-anchor="end">artificial</text>
<circle cx="190" cy="430" r="4" class="sig"/>
<text x="190" y="416" class="mono ink" font-size="11.5" text-anchor="middle">CogNeW · EEG &amp; neuromodulation</text>
<circle cx="380" cy="430" r="4" class="sig"/>
<text x="380" y="454" class="mono ink" font-size="11.5" text-anchor="middle">Neurorights poster</text>
<circle cx="640" cy="430" r="4" class="sig"/>
<text x="640" y="416" class="mono ink" font-size="11.5" text-anchor="middle">Aletheia · Exp 001</text>
<circle cx="820" cy="430" r="4" class="sig"/>
<text x="820" y="454" class="mono ink" font-size="11.5" text-anchor="middle">Persuasion Topography</text>
<circle cx="960" cy="430" r="4" class="sig"/>
<text x="960" y="416" class="mono ink" font-size="11.5" text-anchor="middle">Pressure evals v0.1</text>
<circle cx="1100" cy="430" r="4" class="sig"/>
<text x="1100" y="454" class="mono ink" font-size="11.5" text-anchor="end">ABIM · clinical AI eval</text>
<line x1="48" y1="514" x2="1152" y2="514" class="hair"/>
<text x="48" y="540" class="mono wine label" text-anchor="start">FIGURE 1</text>
<text x="140" y="540" class="serif muted" font-size="14" text-anchor="start">Research program. Questions about belief updating and influence, studied in brains and</text>
<text x="140" y="560" class="serif muted" font-size="14" text-anchor="start">people (left) and in interacting artificial agents (right).</text>
</svg>
