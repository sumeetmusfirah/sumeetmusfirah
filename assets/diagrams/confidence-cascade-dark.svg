<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 392" width="1200" height="392" role="img" aria-labelledby="t d">
<title id="t">Sketch: confidence cascade across agents</title>
<desc id="d">Schematic, not data. Eight agents in a chain; each turns orange and raises a confidence bar after the previous one, while a dashed evidence line stays flat. Illustrates the question of whether confidence can propagate independently of evidence.</desc>
<style>
.serif{font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif}
.mono{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.ink{fill:#FAF9F5} .muted{fill:#B0AEA5} .moss{fill:#A9BC8A}
.wine{fill:#E08A6D} .clay{fill:#E08A6D} .sig{fill:#D97757}
.hair{stroke:#3A3934;stroke-width:1;fill:none}
.line{stroke:#B0AEA5;stroke-width:0.9;fill:none}
.motif{stroke:#95A876;stroke-width:1.1;fill:none;stroke-linecap:round}
.box{fill:#24231F;stroke:#3A3934;stroke-width:1}
.label{font-size:11px;letter-spacing:1.8px}
@keyframes draw{from{stroke-dashoffset:260}to{stroke-dashoffset:0}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes travel{0%{offset-distance:0%;opacity:0}8%{opacity:1}92%{opacity:1}100%{offset-distance:100%;opacity:0}}
@keyframes glow{0%,62%,100%{r:4.2px;opacity:1}70%{r:6.5px;opacity:.55}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.draw{stroke-dasharray:260;animation:draw 2.4s cubic-bezier(.4,0,.2,1) both}
.late{animation:fadein 1.2s ease-out 1.6s both}
.pulse{opacity:0;offset-path:path('M900,185 L980,185 L1040,140 L1100,172');animation:travel 3.2s ease-in-out 2.6s infinite}
.glow{animation:glow 3.2s ease-in-out 2.6s infinite}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 6s ease-in-out infinite}
.cursor{animation:blink 1.1s steps(1) infinite}
</style>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#B0AEA5" stroke-width="1.3"/></marker></defs>
<rect width="1200" height="392" rx="6" fill="#1A1915"/>
<style>@keyframes on0{0%,8.3%{opacity:0}11.3%,92%{opacity:1}100%{opacity:0}}@keyframes bar0{0%,8.3%{transform:scaleY(0)}13.3%,92%{transform:scaleY(1.00)}100%{transform:scaleY(0)}}.n0{opacity:1;animation:on0 12.0s ease-out infinite}.b0{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(1.00);animation:bar0 12.0s ease-out infinite}@keyframes on1{0%,16.7%{opacity:0}19.7%,92%{opacity:1}100%{opacity:0}}@keyframes bar1{0%,16.7%{transform:scaleY(0)}21.7%,92%{transform:scaleY(0.96)}100%{transform:scaleY(0)}}.n1{opacity:1;animation:on1 12.0s ease-out infinite}.b1{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0.96);animation:bar1 12.0s ease-out infinite}@keyframes on2{0%,25.0%{opacity:0}28.0%,92%{opacity:1}100%{opacity:0}}@keyframes bar2{0%,25.0%{transform:scaleY(0)}30.0%,92%{transform:scaleY(0.92)}100%{transform:scaleY(0)}}.n2{opacity:1;animation:on2 12.0s ease-out infinite}.b2{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0.92);animation:bar2 12.0s ease-out infinite}@keyframes on3{0%,33.3%{opacity:0}36.3%,92%{opacity:1}100%{opacity:0}}@keyframes bar3{0%,33.3%{transform:scaleY(0)}38.3%,92%{transform:scaleY(0.88)}100%{transform:scaleY(0)}}.n3{opacity:1;animation:on3 12.0s ease-out infinite}.b3{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0.88);animation:bar3 12.0s ease-out infinite}@keyframes on4{0%,41.7%{opacity:0}44.7%,92%{opacity:1}100%{opacity:0}}@keyframes bar4{0%,41.7%{transform:scaleY(0)}46.7%,92%{transform:scaleY(0.84)}100%{transform:scaleY(0)}}.n4{opacity:0;animation:on4 12.0s ease-out infinite}.b4{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0.00);animation:bar4 12.0s ease-out infinite}@keyframes on5{0%,50.0%{opacity:0}53.0%,92%{opacity:1}100%{opacity:0}}@keyframes bar5{0%,50.0%{transform:scaleY(0)}55.0%,92%{transform:scaleY(0.80)}100%{transform:scaleY(0)}}.n5{opacity:0;animation:on5 12.0s ease-out infinite}.b5{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0.00);animation:bar5 12.0s ease-out infinite}@keyframes on6{0%,58.3%{opacity:0}61.3%,92%{opacity:1}100%{opacity:0}}@keyframes bar6{0%,58.3%{transform:scaleY(0)}63.3%,92%{transform:scaleY(0.76)}100%{transform:scaleY(0)}}.n6{opacity:0;animation:on6 12.0s ease-out infinite}.b6{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0.00);animation:bar6 12.0s ease-out infinite}@keyframes on7{0%,66.7%{opacity:0}69.7%,92%{opacity:1}100%{opacity:0}}@keyframes bar7{0%,66.7%{transform:scaleY(0)}71.7%,92%{transform:scaleY(0.72)}100%{transform:scaleY(0)}}.n7{opacity:0;animation:on7 12.0s ease-out infinite}.b7{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0.00);animation:bar7 12.0s ease-out infinite}</style>
<text x="48" y="56" class="mono wine label" text-anchor="start">SCHEMATIC · NOT DATA</text>
<text x="48" y="86" class="serif ink" font-size="20" text-anchor="start" font-style="italic">Can confidence travel further than the evidence that justified it?</text>
<rect x="115" y="112" width="10" height="50" class="hair"/>
<rect x="115" y="112" width="10" height="50" class="clay b0"/>
<circle cx="120" cy="200" r="12" class="motif" style="fill:#24231F"/>
<circle cx="120" cy="200" r="12" class="sig n0"/>
<text x="120" y="236" class="mono muted" font-size="11" text-anchor="middle">agent 1</text>
<line x1="134" y1="200" x2="241" y2="200" class="line" marker-end="url(#arr)"/>
<rect x="252" y="112" width="10" height="50" class="hair"/>
<rect x="252" y="112" width="10" height="50" class="clay b1"/>
<circle cx="257" cy="200" r="12" class="motif" style="fill:#24231F"/>
<circle cx="257" cy="200" r="12" class="sig n1"/>
<text x="257" y="236" class="mono muted" font-size="11" text-anchor="middle">agent 2</text>
<line x1="271" y1="200" x2="378" y2="200" class="line" marker-end="url(#arr)"/>
<rect x="389" y="112" width="10" height="50" class="hair"/>
<rect x="389" y="112" width="10" height="50" class="clay b2"/>
<circle cx="394" cy="200" r="12" class="motif" style="fill:#24231F"/>
<circle cx="394" cy="200" r="12" class="sig n2"/>
<text x="394" y="236" class="mono muted" font-size="11" text-anchor="middle">agent 3</text>
<line x1="408" y1="200" x2="515" y2="200" class="line" marker-end="url(#arr)"/>
<rect x="526" y="112" width="10" height="50" class="hair"/>
<rect x="526" y="112" width="10" height="50" class="clay b3"/>
<circle cx="531" cy="200" r="12" class="motif" style="fill:#24231F"/>
<circle cx="531" cy="200" r="12" class="sig n3"/>
<text x="531" y="236" class="mono muted" font-size="11" text-anchor="middle">agent 4</text>
<line x1="545" y1="200" x2="652" y2="200" class="line" marker-end="url(#arr)"/>
<rect x="663" y="112" width="10" height="50" class="hair"/>
<rect x="663" y="112" width="10" height="50" class="clay b4"/>
<circle cx="668" cy="200" r="12" class="motif" style="fill:#24231F"/>
<circle cx="668" cy="200" r="12" class="sig n4"/>
<text x="668" y="236" class="mono muted" font-size="11" text-anchor="middle">agent 5</text>
<line x1="682" y1="200" x2="789" y2="200" class="line" marker-end="url(#arr)"/>
<rect x="800" y="112" width="10" height="50" class="hair"/>
<rect x="800" y="112" width="10" height="50" class="clay b5"/>
<circle cx="805" cy="200" r="12" class="motif" style="fill:#24231F"/>
<circle cx="805" cy="200" r="12" class="sig n5"/>
<text x="805" y="236" class="mono muted" font-size="11" text-anchor="middle">agent 6</text>
<line x1="819" y1="200" x2="926" y2="200" class="line" marker-end="url(#arr)"/>
<rect x="937" y="112" width="10" height="50" class="hair"/>
<rect x="937" y="112" width="10" height="50" class="clay b6"/>
<circle cx="942" cy="200" r="12" class="motif" style="fill:#24231F"/>
<circle cx="942" cy="200" r="12" class="sig n6"/>
<text x="942" y="236" class="mono muted" font-size="11" text-anchor="middle">agent 7</text>
<line x1="956" y1="200" x2="1063" y2="200" class="line" marker-end="url(#arr)"/>
<rect x="1074" y="112" width="10" height="50" class="hair"/>
<rect x="1074" y="112" width="10" height="50" class="clay b7"/>
<circle cx="1079" cy="200" r="12" class="motif" style="fill:#24231F"/>
<circle cx="1079" cy="200" r="12" class="sig n7"/>
<text x="1079" y="236" class="mono muted" font-size="11" text-anchor="middle">agent 8</text>
<line x1="108" y1="262" x2="1091" y2="262" stroke="#A9BC8A" stroke-width="1.4" stroke-dasharray="5 5"/>
<text x="108" y="284" class="mono moss" font-size="11.5" text-anchor="start">evidence available to each agent: unchanged</text>
<text x="1091" y="284" class="mono clay" font-size="11.5" text-anchor="end">bars = expressed confidence</text>
<line x1="48" y1="316" x2="1152" y2="316" class="hair"/>
<text x="48" y="342" class="mono wine label" text-anchor="start">SKETCH</text>
<text x="140" y="342" class="serif muted" font-size="14" text-anchor="start">An illustration of the hypothesis Aletheia tests, not a result: each agent sees the previous</text>
<text x="140" y="362" class="serif muted" font-size="14" text-anchor="start">agent's answer and confidence, while the evidence itself never changes.</text>
</svg>
